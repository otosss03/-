<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="현황팸 게임 클립 모음">
<meta name="theme-color" content="#e8231d">
<meta property="og:site_name" content="현황">
<meta property="og:type" content="website">
<meta property="og:title" content="현황">

<title>현황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='10' fill='%23e8231d' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='43' font-size='26' font-weight='900' font-family='sans-serif' fill='white' text-anchor='middle' transform='rotate(-6 32 32)'%3E현%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f2f2f2;
    --surface-2: #e5e5e5;
    --text: #0f0f0f;
    --muted: #606060;
    --line: #e5e5e5;
    --accent: #e8231d;
    --accent-ink: #ffffff;
    --danger: #cc2f26;
    --link: #065fd4;
    --overlay: rgba(0, 0, 0, .8);
    --font: "Roboto", "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f0f0f; --surface: #272727; --surface-2: #3f3f3f;
      --text: #f1f1f1; --muted: #aaaaaa; --line: #3f3f3f; --danger: #ff6b61; --link: #3ea6ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f0f0f; --surface: #272727; --surface-2: #3f3f3f;
    --text: #f1f1f1; --muted: #aaaaaa; --line: #3f3f3f; --danger: #ff6b61; --link: #3ea6ff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ── Header ── */
  .top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: grid; grid-template-columns: auto minmax(0, 640px) auto; justify-content: space-between;
    align-items: center; gap: 16px; height: 56px; padding: 0 16px;
  }
  .logo { display: flex; align-items: center; gap: 2px; padding: 4px 2px; }
  .logo .badge {
    display: inline-block; padding: 3px 10px 1px; border-radius: 6px;
    background: var(--accent); color: #fff; transform: rotate(-5deg);
    font: 24px/1.1 "Black Han Sans", "Noto Sans KR", sans-serif; letter-spacing: 0.02em;
  }
  .logo svg { width: 14px; height: 18px; flex: none; margin-top: -14px; }
  .search { display: flex; min-width: 0; }
  .search input {
    flex: 1; min-width: 0; height: 40px; padding: 0 16px; font: 16px var(--font); color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-right: 0; border-radius: 40px 0 0 40px;
  }
  .search input:focus { border-color: var(--link); outline: none; }
  .search button {
    width: 64px; height: 40px; border: 1px solid var(--line); border-radius: 0 40px 40px 0;
    background: var(--surface); display: grid; place-items: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px;
    border-radius: 18px; border: 0; background: var(--surface); font-weight: 500; white-space: nowrap;
  }
  .pill:hover { background: var(--surface-2); }
  .pill.primary { background: var(--text); color: var(--bg); }
  .pill.danger { color: var(--danger); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  main { padding: 0 24px 24px; }

  /* ── Home ── */
  .chips {
    position: sticky; top: 56px; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 12px; padding: 12px 0; overflow-x: auto; scrollbar-width: none;
  }
  .chip {
    flex: none; height: 32px; padding: 0 12px; border-radius: 8px; border: 0;
    background: var(--surface); font-weight: 500;
  }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .sort { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .sort .chip { background: transparent; color: var(--muted); }
  .sort .chip[aria-pressed="true"] { background: var(--surface); color: var(--text); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 40px 16px; padding-top: 12px;
  }
  .thumb {
    position: relative; display: block; aspect-ratio: 16 / 9; width: 100%; max-width: 100%;
    border-radius: 12px; overflow: hidden; background: var(--surface);
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .dur {
    position: absolute; right: 6px; bottom: 6px; padding: 1px 4px; border-radius: 4px;
    background: var(--overlay); color: #fff; font: 500 12px var(--font); font-variant-numeric: tabular-nums;
  }
  .card { display: grid; gap: 12px; align-content: start; }
  .card .thumb { transition: border-radius .15s; }
  .card:hover .thumb { border-radius: 0; }
  .row { display: flex; gap: 12px; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 500; font-size: 15px;
  }
  .title2 {
    font-size: 16px; font-weight: 500; line-height: 22px; margin: 0 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .sub { color: var(--muted); font-size: 14px; line-height: 20px; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; grid-column: 1 / -1; margin: 0; }
  .notice { grid-column: 1 / -1; margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--surface); color: var(--muted); }

  /* ── Watch ── */
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 402px; gap: 24px; padding-top: 24px; max-width: 1760px; margin: 0 auto; }
  .player {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden; background: #000;
  }
  .player iframe, .player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #ddd; padding: 16px; }
  .player .loading small { display: block; color: #999; margin-top: 4px; }
  .wtitle { font-size: 20px; line-height: 28px; font-weight: 700; margin: 12px 0 0; word-break: break-word; }
  .edit-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .edit-row input {
    flex: 1 1 240px; min-width: 0; height: 40px; padding: 0 12px; font: 500 18px var(--font); color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-bottom: 2px solid var(--text); border-radius: 4px;
  }
  .owner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .owner .who { display: flex; align-items: center; gap: 12px; }
  .owner .avatar { width: 40px; height: 40px; font-size: 17px; }
  .owner b { font-size: 16px; font-weight: 500; display: block; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .desc { background: var(--surface); border-radius: 12px; padding: 12px; margin-top: 12px; display: grid; gap: 6px; }
  .desc strong { font-weight: 500; }
  .desc a, .tag { color: var(--link); }
  .upnext { display: grid; gap: 8px; align-content: start; }
  .upnext h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .mini { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 8px; }
  .mini .thumb { border-radius: 8px; }
  .mini .title2 { font-size: 14px; line-height: 20px; }
  .mini .sub { font-size: 12px; line-height: 18px; }

  /* ── Comments ── */
  .comments { margin-top: 24px; display: grid; gap: 16px; }
  .comments h2 { font-size: 20px; font-weight: 700; margin: 0; }
  .cmt-form { display: grid; gap: 8px; }
  .cmt-who { display: flex; gap: 8px; flex-wrap: wrap; }
  .cmt-who input { flex: 1 1 140px; max-width: 220px; }
  .cmt-form input, .cmt-form textarea {
    font: 14px var(--font); color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0;
  }
  .cmt-form textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
  .cmt-form input:focus, .cmt-form textarea:focus { border-color: var(--link); outline: none; }
  .cmt-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cmt-actions .pill.primary { background: var(--accent); color: var(--accent-ink); }
  .cmt-actions .pill:disabled { opacity: .5; cursor: default; }
  .cmt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .cmt { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
  .cmt .avatar { width: 40px; height: 40px; }
  .cmt-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 13px; }
  .cmt-head b { font-weight: 500; }
  .cmt-head .ip, .cmt-head time { color: var(--muted); font-size: 12px; }
  .cmt-body { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  .cmt-del { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; margin-left: auto; }
  .cmt-del:hover { color: var(--danger); }
  footer { display: flex; justify-content: center; padding: 24px 16px 40px; color: var(--muted); font-size: 12px; gap: 12px; }
  footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }

  /* ── Upload dialog ── */
  dialog {
    width: min(560px, calc(100vw - 32px)); border: 0; border-radius: 12px; padding: 0;
    background: var(--bg); color: var(--text); box-shadow: 0 8px 40px rgba(0,0,0,.35);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg { display: grid; gap: 14px; padding: 20px 24px 24px; }
  .dlg h2 { margin: 0; font-size: 20px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input {
    height: 42px; padding: 0 12px; font: 15px var(--font); color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: 100%;
  }
  .field input:focus { border-color: var(--link); outline: none; }
  .or { text-align: center; color: var(--muted); font-size: 12px; }
  .drop {
    position: relative; display: grid; justify-items: center; gap: 4px; padding: 18px; text-align: center;
    border: 1px dashed var(--muted); border-radius: 8px; cursor: pointer; color: var(--muted);
  }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .drop.has { border-style: solid; border-color: var(--accent); color: var(--text); }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb-pick { display: flex; align-items: center; gap: 12px; }
  .thumb-pick .prev {
    position: relative; flex: none; width: 128px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
    background: var(--surface); display: grid; place-items: center; color: var(--muted); font-size: 12px;
  }
  .thumb-pick .prev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb-pick .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .thumb-pick label.pill { position: relative; overflow: hidden; }
  .thumb-pick label.pill input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .progress { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .msg { margin: 0; min-height: 1.2em; font-size: 13px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dlg-actions .pill.primary { background: var(--accent); color: var(--accent-ink); }
  .dlg-actions .pill:disabled { opacity: .5; cursor: default; }

  .toast {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 8px; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: calc(100vw - 32px);
  }

  @media (max-width: 1000px) { .watch { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    .top { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 0 12px; }
    .logo .badge { font-size: 20px; padding: 2px 8px 0; }
    .search button { width: 44px; }
    .pill .lbl { display: none; }
    .top .pill { padding: 0 10px; }
    main { padding: 0 16px 24px; }
    .grid { grid-template-columns: 1fr; gap: 28px; }
    .watch { padding-top: 0; margin: 0 -16px; }
    .watch > * { padding: 0 16px; }
    .watch .player { border-radius: 0; }
    .mini { grid-template-columns: 140px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#" aria-label="현황 홈">
    <span class="badge">현황</span>
    <svg viewBox="0 0 14 18" aria-hidden="true">
      <path d="M3 7 7 1M4 11l8-4M4 15h8" stroke="#e8231d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </svg>
  </a>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="검색" aria-label="클립 검색">
    <button type="submit" aria-label="검색"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </form>
  <button class="pill" id="openUpload"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">만들기</span></button>
</header>

<main>
  <section id="home">
    <nav class="chips" id="chips" aria-label="게임별 보기"></nav>
    <div class="grid" id="grid"></div>
  </section>

  <section id="watch" class="watch" hidden>
    <div>
      <div class="player" id="player"></div>
      <div id="meta"></div>
      <section class="comments" id="comments" aria-label="댓글">
        <h2 id="cmtCount">댓글</h2>
        <form class="cmt-form" id="cmtForm" autocomplete="off">
          <div class="cmt-who">
            <input id="cmtNick" maxlength="20" placeholder="닉네임" aria-label="닉네임" required>
            <input id="cmtPw" type="password" maxlength="30" placeholder="비밀번호" aria-label="비밀번호 (삭제할 때 필요)" required>
          </div>
          <textarea id="cmtBody" maxlength="500" rows="3" placeholder="댓글 추가…" aria-label="댓글 내용" required></textarea>
          <div class="cmt-actions">
            <span class="sub" id="cmtMsg"></span>
            <button type="submit" class="pill primary" id="cmtSubmit">등록</button>
          </div>
        </form>
        <ol class="cmt-list" id="cmtList"></ol>
      </section>
    </div>
    <aside class="upnext" id="upnext" aria-label="다음 동영상"></aside>
  </section>
</main>

<footer>
  <span>현황 클립 모음</span>
  <button id="adminBtn">관리자 모드</button>
</footer>

<dialog id="upload">
  <form class="dlg" id="addForm" autocomplete="off">
    <h2>클립 올리기</h2>
    <div class="field">
      <label for="url">유튜브 링크</label>
      <input id="url" placeholder="https://youtu.be/…">
      <span class="sub" style="font-size:12px">mp4는 유튜브에 '일부 공개'로 올린 뒤 그 링크를 붙여넣어 주세요.</span>
    </div>
    <div class="or" hidden>또는</div>
    <label class="drop" id="drop" hidden>
      <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <span id="fileName">mp4 파일 선택 (50MB 이하)</span>
    </label>
    <div class="field">
      <span style="font-size:13px;color:var(--muted)">썸네일 사진 (선택)</span>
      <div class="thumb-pick">
        <div class="prev" id="thumbPrev">자동</div>
        <div class="btns">
          <label class="pill">사진 선택<input type="file" id="thumbFile" accept="image/jpeg,image/png,image/webp"></label>
          <button type="button" class="pill" id="thumbClear" hidden>빼기</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="title">제목</label>
      <input id="title" maxlength="100" placeholder="클립 제목">
    </div>
    <div class="field">
      <label for="game">게임</label>
      <input id="game" maxlength="40" placeholder="예: 아크서버">
    </div>
    <div class="field">
      <label for="nick">올린 사람</label>
      <input id="nick" maxlength="30" placeholder="닉네임">
    </div>
    <div class="progress" id="progress" hidden><i id="bar"></i></div>
    <p class="msg" id="msg"></p>
    <div class="dlg-actions">
      <button type="button" class="pill" id="cancelUpload">취소</button>
      <button type="submit" class="pill primary" id="submitUpload">올리기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="thumbEdit" accept="image/jpeg,image/png,image/webp" hidden>

<script>
/* ── Supabase 공용 저장소 ── */
const SUPABASE_URL = "https://uymatqpxhphwcacqawod.supabase.co";
const SUPABASE_KEY = "sb_publishable_lBUmlIbI6MEpVpKuC7fg-g_06z-voNe";
const HEADERS = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
if (SUPABASE_KEY.startsWith("eyJ")) HEADERS.Authorization = `Bearer ${SUPABASE_KEY}`;
const BUCKET = "videos";
const MAX_MB = 50;

const $ = (id) => document.getElementById(id);

/* ── 브라우저 저장 (내가 올린 클립 열쇠, 관리자 비밀번호, 닉네임) ── */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let myTokens = store.get("cl-tokens", {});
let adminCode = store.get("cl-admin", "");

/* ── 상태 ── */
let clips = [];
let loaded = false;
let loadError = "";
let needsSetup = false;
let filter = "전체";
let sortMode = store.get("cl-sort", "views");
let query = "";
let currentId = null;
let editing = false;

/* ── 서버 호출 ── */
async function rpc(name, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: HEADERS, body: JSON.stringify(args) });
  const text = await r.text();
  if (!r.ok) {
    let serverMsg = ""; try { serverMsg = JSON.parse(text).message || ""; } catch {}
    const e = new Error(/[가-힣]/.test(serverMsg) ? serverMsg
      : r.status === 401 || r.status === 403 ? "권한이 없어요" : r.status === 404 ? "설정이 아직 안 됐어요" : `오류 ${r.status}`);
    e.status = r.status; throw e;
  }
  return text ? JSON.parse(text) : null;
}

let degraded = false;   // Supabase가 막혔을 때 백업 목록(clips.json)으로 보여주는 중
let lastSig = "";
async function fetchRows() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/clips?select=*&order=created_at.desc`, { headers: HEADERS });
    if (!r.ok) throw new Error(r.status);
    degraded = false;
    return await r.json();
  } catch (e) {
    const r = await fetch(`${BASE}clips.json?${Date.now() / 600000 | 0}`);
    if (!r.ok) throw e;
    degraded = true;
    return (await r.json()).reverse();
  }
}
async function loadClips() {
  try {
    const rows = await fetchRows();
    needsSetup = rows.length > 0 && !("views" in rows[0]);
    clips = rows.map((c) => ({
      dbId: c.id, id: c.video_id, file: c.video_url, start: c.start_sec || 0,

      views: c.views || 0, duration: c.duration_sec || null, created: c.created_at, thumb: degraded ? null : (c.thumb_url || null),
    }));

/* ── 형식 ── */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; }
function fmtViews(n) {
  const t = (v) => v.toFixed(1).replace(/\.0$/, "");
  if (n < 1000) return `${n}회`;
  if (n < 10000) return `${t(n / 1000)}천회`;
  if (n < 1e8) return `${n < 1e5 ? t(n / 1e4) : Math.floor(n / 1e4)}만회`;
  return `${t(n / 1e8)}억회`;
}
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  const u = [[31536000, "년"], [2592000, "개월"], [604800, "주"], [86400, "일"], [3600, "시간"], [60, "분"]];
  for (const [sec, name] of u) if (s >= sec) return `${Math.floor(s / sec)}${name} 전`;
  return "방금 전";
}
function avatar(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `<span class="avatar" style="background:hsl(${h} 42% 42%)" aria-hidden="true">${esc([...name][0] || "?")}</span>`;
}
// 직접 올린 썸네일: GitHub에 작게 줄인 복사본이 있으면 그걸 씀 (Supabase 전송량 절약)
let ghThumbs = {};
async function loadGhThumbs() {

}

// 올리기 전에 썸네일을 640px 폭, WebP(안 되면 JPEG)로 압축 → 보통 20~60KB
async function compressImage(file) {
  const bmp = await createImageBitmap(file);
  const w = Math.min(640, bmp.width), h = Math.round(bmp.height * w / bmp.width);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const toBlob = (type, q) => new Promise((res) => cv.toBlob(res, type, q));
  let blob = await toBlob("image/webp", 0.72);
  if (!blob || blob.type !== "image/webp") blob = await toBlob("image/jpeg", 0.75);
  const ext = blob.type === "image/webp" ? "webp" : "jpg";
  return new File([blob], `thumb.${ext}`, { type: blob.type });
}

function thumbHTML(c) {
  const media = c.thumb

    : `<img src="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" alt="" loading="lazy">`;
  return `${media}${c.duration ? `<span class="dur">${fmtDur(c.duration)}</span>` : ""}`;
}
function statLine(c) {
  const parts = [];
  if (!degraded) parts.push(`조회수 ${fmtViews(c.views)}`);
  if (c.created) parts.push(ago(c.created));

const blobCache = new Map();
let loadSeq = 0;
async function playFile(url) {
  const seq = ++loadSeq;
  const show = (src) => { if (seq === loadSeq) $("player").innerHTML = `<video src="${src}" controls autoplay playsinline></video>`; };
  if (blobCache.has(url)) return show(blobCache.get(url));
  $("player").innerHTML = `<div class="loading"><div>영상 불러오는 중 <b id="loadPct">0%</b><small>다 받으면 끊김 없이 재생돼요</small></div></div>`;
  try {
    const r = await fetch(url);
    if (!r.ok || !r.body) throw new Error(r.status);
    const total = +r.headers.get("Content-Length") || 0;
    const reader = r.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (seq !== loadSeq) { reader.cancel(); return; }
      parts.push(value); got += value.length;
      const el = document.getElementById("loadPct");
      if (el) el.textContent = total ? `${Math.round(got / total * 100)}%` : `${(got / 1048576).toFixed(1)}MB`;
    }
    const b = URL.createObjectURL(new Blob(parts, { type: r.headers.get("Content-Type") || "video/mp4" }));
    blobCache.set(url, b); show(b);
  } catch { show(url); }
}

    let url = null;
    if (file) {
      if (file.size > 20 * 1048576) return toast("썸네일 사진은 20MB 이하로 골라주세요");
      toast("썸네일 올리는 중…");
      url = await uploadFile(await compressImage(file), "t-");
    }
    const removed = await rpc("set_thumb", { p_id: c.dbId, p_thumb: url, ...authArgs(c) });
    if (removed) fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${removed}`, { method: "DELETE", headers: HEADERS }).catch(() => {});
    c.thumb = url; renderMeta(c); renderUpNext(c);
    toast(url ? "썸네일을 바꿨어요" : "기본 썸네일로 되돌렸어요");
  } catch (err) {
    c.thumb = old;
    toast(err.status === 404 ? "Supabase에서 setup-v5.sql 을 먼저 실행해 주세요" : `바꾸지 못했어요: ${err.message}`);
  }
}
$("thumbEdit").addEventListener("change", (e) => {
  const c = clips.find((x) => x.dbId === currentId);
  const f = e.target.files[0];
  e.target.value = "";
  if (c && f) changeThumb(c, f);
});
$("meta").addEventListener("keydown", (e) => {
  if (e.target.id === "thumbBtn" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("thumbEdit").click(); }
});
$("meta").addEventListener("keydown", (e) => {
  if (e.target.id === "editTitle" && e.key === "Enter") $("editSave").click();
  if (e.target.id === "editTitle" && e.key === "Escape") $("editCancel").click();
});

/* ── 관리자 모드 ── */
function renderAdminBtn() { $("adminBtn").textContent = adminCode ? "관리자 모드 끄기" : "관리자 모드"; }
$("adminBtn").addEventListener("click", async () => {
  if (adminCode) { adminCode = ""; store.set("cl-admin", ""); renderAdminBtn(); renderLists(); return toast("관리자 모드를 껐어요"); }
  const code = prompt("관리자 비밀번호");
  if (!code) return;
  try {
    if (await rpc("check_admin", { p_admin: code })) {
      adminCode = code; store.set("cl-admin", code); renderAdminBtn(); renderLists();
      toast("관리자 모드: 모든 클립을 수정·삭제할 수 있어요");
    } else toast("비밀번호가 맞지 않아요");
  } catch (err) { toast(`확인하지 못했어요: ${err.message}`); }
});

/* ── 올리기 ── */
function parseYouTube(input) {
  try {
    const u = new URL(input.trim());
    const host = u.hostname.replace(/^www\.|^m\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.slice(1);
    else if (host.endsWith("youtube.com")) {
      if (u.pathname === "/watch") id = u.searchParams.get("v");
      else { const m = u.pathname.match(/^\/(shorts|embed|live)\/([^/?]+)/); if (m) id = m[2]; }
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    let start = 0;
    const t = u.searchParams.get("t") || u.searchParams.get("start");
    if (t) {
      if (/^\d+$/.test(t)) start = +t;
      else { const mm = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/); if (mm) start = (+mm[1] || 0) * 3600 + (+mm[2] || 0) * 60 + (+mm[3] || 0); }
    }
    return { id, start };
  } catch { return null; }
}

function videoDuration(file) {
  return new Promise((res) => {
    const v = document.createElement("video"); const u = URL.createObjectURL(file);
    let settled = false;
    const done = (d) => { if (settled) return; settled = true; URL.revokeObjectURL(u); res(d); };
    v.preload = "metadata";
    v.onloadedmetadata = () => done(isFinite(v.duration) ? Math.round(v.duration) : null);
    v.onerror = () => done(null); setTimeout(() => done(null), 5000); v.src = u;
  });
}

function uploadFile(file, prefix = "") {
  const ext = (file.name.match(/\.(mp4|webm|mov|jpe?g|png|webp)$/i) || [".mp4"])[0].toLowerCase();
  const path = `${prefix}${Date.now()}-${Math.random().toString(36).slice(2, 8)}${ext}`;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
    for (const [k, v] of Object.entries(HEADERS)) if (k !== "Content-Type") xhr.setRequestHeader(k, v);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "false");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("bar").style.width = `${e.loaded / e.total * 100}%`; };
    xhr.onload = () => xhr.status < 300
      ? resolve(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`)
      : reject(new Error(`업로드 실패 (${xhr.status})`));
    xhr.onerror = () => reject(new Error("네트워크 오류"));
    xhr.send(file);
  });
}

function resetUploadForm() {
  $("addForm").reset(); $("nick").value = store.get("cl-nick", "");
  $("fileName").textContent = "mp4 파일 선택 (50MB 이하)"; $("drop").classList.remove("has");
  $("msg").textContent = ""; $("msg").className = "msg"; $("progress").hidden = true;
  clearThumb();
}
let thumbPreviewUrl = null;
function clearThumb() {
  $("thumbFile").value = "";
  if (thumbPreviewUrl) URL.revokeObjectURL(thumbPreviewUrl);
  thumbPreviewUrl = null;
  $("thumbPrev").innerHTML = "자동"; $("thumbClear").hidden = true;
}
$("thumbFile").addEventListener("change", () => {
  const f = $("thumbFile").files[0];
  if (!f) return clearThumb();
  if (f.size > 20 * 1048576) { clearThumb(); $("msg").className = "msg err"; $("msg").textContent = "썸네일 사진은 20MB 이하로 골라주세요."; return; }
  if (thumbPreviewUrl) URL.revokeObjectURL(thumbPreviewUrl);
  thumbPreviewUrl = URL.createObjectURL(f);
  $("thumbPrev").innerHTML = `<img src="${thumbPreviewUrl}" alt="선택한 썸네일">`;
  $("thumbClear").hidden = false; $("msg").textContent = "";
});
$("thumbClear").addEventListener("click", clearThumb);
$("openUpload").addEventListener("click", () => { resetUploadForm(); $("upload").showModal(); $("url").focus(); });
$("cancelUpload").addEventListener("click", () => $("upload").close());
$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  $("fileName").textContent = f ? `${f.name} · ${(f.size / 1048576).toFixed(1)}MB` : "mp4 파일 선택 (50MB 이하)";
  $("drop").classList.toggle("has", !!f);
  if (f) { $("url").value = ""; if (!$("title").value) $("title").value = f.name.replace(/\.[^.]+$/, "").slice(0, 100); }
});

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg");
  const fail = (t) => { msg.className = "msg err"; msg.textContent = t; };
  const file = $("file").files[0];
  const urlText = $("url").value.trim();
  const nick = $("nick").value.trim();
  const args = {
    p_video_id: null, p_video_url: null, p_start: 0, p_duration: null,
    p_title: ($("title").value.trim() || "제목 없는 클립").slice(0, 100),
    p_game: ($("game").value.trim() || "기타").slice(0, 40),
    p_uploader: nick || null,
    p_token: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`) + "-" + Math.random().toString(36).slice(2),
  };
  if (file) {
    if (file.size > MAX_MB * 1048576) return fail(`파일이 ${(file.size / 1048576).toFixed(0)}MB라 너무 커요. ${MAX_MB}MB 이하로 줄여서 올려주세요.`);
  } else if (urlText) {
    const p = parseYouTube(urlText);
    if (!p) return fail("유튜브 영상 주소를 인식하지 못했어요. youtube.com/watch?v=… 형태의 링크를 붙여넣어 주세요.");
    args.p_video_id = p.id; args.p_start = p.start;
  } else return fail("유튜브 링크를 붙여넣어 주세요.");

  const btn = $("submitUpload"); btn.disabled = true; msg.className = "msg";
  try {
    if (file) {
      args.p_duration = await videoDuration(file);
      $("progress").hidden = false; $("bar").style.width = "0";
      msg.textContent = "영상 올리는 중… 창을 닫지 마세요.";
      args.p_video_url = await uploadFile(file);
    } else msg.textContent = "올리는 중…";
    const thumbFile = $("thumbFile").files[0];
    if (thumbFile) {
      msg.textContent = "썸네일 올리는 중…";
      args.p_thumb = await uploadFile(await compressImage(thumbFile), "t-");
    }
    const newId = await rpc("add_clip", args);
    myTokens[newId] = args.p_token; store.set("cl-tokens", myTokens);
    if (nick) store.set("cl-nick", nick);
    $("upload").close();
    await loadClips();
    go(clipPath(newId));
    toast("올렸어요. 이제 모두에게 보여요");
  } catch (err) {
    fail(err.status === 404 ? "Supabase에서 setup-v4.sql 을 먼저 실행해 주세요." : `올리지 못했어요: ${err.message}`);
  } finally { btn.disabled = false; $("progress").hidden = true; }
});

renderAdminBtn();
renderHome();
loadGhThumbs().then(loadClips);
setInterval(() => loadGhThumbs().then(loadClips), 30000);

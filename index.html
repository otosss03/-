<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Clip Locker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #12151c;
    --panel: #1a1e28;
    --panel-2: #222735;
    --line: #2d3344;
    --text: #e8eaf0;
    --muted: #8a91a6;
    --accent: #f2b134;
    --accent-ink: #1a1405;
    --danger: #e0625a;
    --display: "Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif;
    --body: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 var(--body);
    padding: 0 16px 48px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }

  header {
    display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding-top: 28px; border-bottom: 1px solid var(--line); padding-bottom: 16px;
  }
  .brand { display: grid; gap: 2px; }
  .brand h1 {
    margin: 0; font: 700 clamp(28px, 5vw, 40px)/1 var(--display);
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .count { font: 600 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .count b { color: var(--accent); font-weight: 600; }

  /* Player */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; }
  .screen {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
    background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .screen .idle {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 16px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      var(--panel);
  }
  .now { display: grid; gap: 10px; align-content: start; }
  .now .label { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .now h2 { margin: 0; font: 700 22px/1.25 var(--display); text-wrap: balance; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font: 500 12px var(--mono); padding: 2px 8px; border-radius: 3px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  }
  .now a { color: var(--accent); font-size: 13px; }

  /* Add form */
  form.add {
    display: grid; grid-template-columns: 2fr auto 1.4fr 1fr auto; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
  }
  input {
    width: 100%; min-width: 0; font: 14px var(--body); color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px;
  }
  input::placeholder { color: #5d6479; }
  input:focus-visible, button:focus-visible, .clip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: 600 14px var(--body); cursor: pointer; border-radius: 4px; padding: 9px 16px;
    background: var(--accent); color: var(--accent-ink); border: 0; white-space: nowrap;
  }
  .file-btn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
    font: 500 14px var(--body); color: var(--text); padding: 9px 12px; border-radius: 4px;
    border: 1px dashed var(--line); background: var(--bg); max-width: 220px; overflow: hidden;
  }
  .file-btn span { overflow: hidden; text-overflow: ellipsis; }
  .file-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-btn.has-file { border-style: solid; border-color: var(--accent); color: var(--accent); }
  .progress { grid-column: 1 / -1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .badge-mp4 {
    position: absolute; right: 8px; bottom: 8px; font: 600 10px var(--mono); letter-spacing: .08em;
    background: rgba(18,21,28,.85); color: var(--text); padding: 2px 6px; border-radius: 3px;
  }
  .form-msg { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  .form-msg.err { color: var(--danger); }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    font: 500 13px var(--body); padding: 5px 12px; border-radius: 999px;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .clip {
    display: grid; gap: 8px; cursor: pointer; text-align: left;
    background: none; border: 0; padding: 0; color: inherit; font: inherit; position: relative;
  }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden;
    border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
  .clip:hover .thumb img { transform: scale(1.04); }
  .clip.playing .thumb { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .clip.playing .thumb::after {
    content: "재생 중"; position: absolute; left: 8px; top: 8px;
    font: 600 11px var(--mono); background: var(--accent); color: var(--accent-ink);
    padding: 2px 6px; border-radius: 3px;
  }
  .clip .t { font-weight: 600; line-height: 1.35; }
  .clip .sub { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .del {
    position: absolute; right: 6px; top: 6px; background: rgba(18,21,28,.85); color: var(--muted);
    font: 500 12px var(--body); padding: 3px 8px; border-radius: 3px; opacity: 0; transition: opacity .15s;
  }
  .clip:hover .del, .del:focus-visible { opacity: 1; }
  .empty { color: var(--muted); font-size: 14px; }

  @media (max-width: 860px) {
    .stage { grid-template-columns: 1fr; }
    form.add { grid-template-columns: 1fr 1fr; }
    form.add .url { grid-column: 1 / -1; }
    form.add .file-btn { grid-column: 1 / -1; max-width: none; justify-content: center; }
    form.add button { grid-column: 1 / -1; }
    .del { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Clip<span>/</span>Locker</h1>
      <p>유튜브에 올린 게임 클립 모음</p>
    </div>
    <div class="count"><b id="count">0</b> CLIPS</div>
  </header>

  <section class="stage" aria-label="플레이어">
    <div class="screen" id="screen">
      <div class="idle">아래에서 클립을 선택하면 여기서 재생돼요</div>
    </div>
    <div class="now" id="now">
      <span class="label">Now playing</span>
      <h2>선택된 클립 없음</h2>
    </div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input class="url" id="url" placeholder="유튜브 링크 붙여넣기">
    <label class="file-btn" id="fileBtn"><input type="file" id="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov"><span id="fileName">또는 mp4 파일 선택</span></label>
    <input id="title" placeholder="클립 제목">
    <input id="game" placeholder="게임 이름">
    <button type="submit">클립 추가</button>
    <div class="progress" id="progress" hidden><i id="bar"></i></div>
    <p class="form-msg" id="msg"></p>
  </form>

  <nav class="filters" id="filters" aria-label="게임별 보기"></nav>

  <section class="grid" id="grid" aria-label="클립 목록"></section>
</div>

<script>
/* Supabase 공용 저장소 — 누가 추가해도 모두에게 보여요 */
const SUPABASE_URL = "https://uymatqpxhphwcacqawod.supabase.co";
const SUPABASE_KEY = "sb_publishable_lBUmlIbI6MEpVpKuC7fg-g_06z-voNe";
const API = `${SUPABASE_URL}/rest/v1/clips`;
const HEADERS = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
if (SUPABASE_KEY.startsWith("eyJ")) HEADERS.Authorization = `Bearer ${SUPABASE_KEY}`;

const $ = (id) => document.getElementById(id);
const BUCKET = "videos";
const MAX_MB = 50; // Supabase 무료 플랜의 파일 1개당 최대 크기

function parseYouTube(input) {
  try {
    const u = new URL(input.trim());
    const host = u.hostname.replace(/^www\.|^m\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.slice(1);
    else if (host.endsWith("youtube.com")) {
      if (u.pathname === "/watch") id = u.searchParams.get("v");
      else {
        const m = u.pathname.match(/^\/(shorts|embed|live)\/([^/?]+)/);
        if (m) id = m[2];
      }
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    let start = 0;
    const t = u.searchParams.get("t") || u.searchParams.get("start");
    if (t) {
      if (/^\d+$/.test(t)) start = +t;
      else {
        const mm = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (mm) start = (+mm[1] || 0) * 3600 + (+mm[2] || 0) * 60 + (+mm[3] || 0);
      }
    }
    return { id, start };
  } catch { return null; }
}

let clips = [];
let filter = "전체";
let currentId = null;
let loadError = "";

async function loadClips() {
  try {
    const r = await fetch(`${API}?select=*&order=created_at.desc`, { headers: HEADERS });
    if (!r.ok) throw new Error(r.status);
    clips = (await r.json()).map((c) => ({
      key: c.video_url || c.video_id, id: c.video_id, file: c.video_url,
      start: c.start_sec, title: c.title, game: c.game }));
    loadError = "";
  } catch (e) {
    loadError = "클립 목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.";
  }
  render();
}

// mp4는 끝까지 받아둔 뒤 재생해서 중간에 끊기지 않게 함 (한 번 받은 영상은 다시 안 받음)
const blobCache = new Map();
let loadSeq = 0;
async function playFile(url) {
  const seq = ++loadSeq;
  const show = (blobUrl) => {
    if (seq !== loadSeq) return;
    $("screen").innerHTML = `<video src="${blobUrl}" controls autoplay playsinline></video>`;
  };
  if (blobCache.has(url)) return show(blobCache.get(url));
  $("screen").innerHTML = `<div class="idle"><div>영상 불러오는 중 <b id="loadPct">0%</b><br>
    <span style="font-size:12px">다 받으면 끊김 없이 재생돼요</span></div></div>`;
  try {
    const r = await fetch(url);
    if (!r.ok || !r.body) throw new Error(r.status);
    const total = +r.headers.get("Content-Length") || 0;
    const reader = r.body.getReader();
    const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (seq !== loadSeq) { reader.cancel(); return; }
      parts.push(value); got += value.length;
      const el = document.getElementById("loadPct");
      if (el) el.textContent = total ? `${Math.round((got / total) * 100)}%` : `${(got / 1048576).toFixed(1)}MB`;
    }
    const blobUrl = URL.createObjectURL(new Blob(parts, { type: r.headers.get("Content-Type") || "video/mp4" }));
    blobCache.set(url, blobUrl);
    show(blobUrl);
  } catch {
    show(url); // 미리 받기에 실패하면 바로 재생
  }
}

function play(clip) {
  currentId = clip.key;
  if (clip.file) {
    playFile(clip.file);
  } else if (location.protocol === "file:") {
    $("screen").innerHTML = `<div class="idle">파일을 더블클릭해서 열면 유튜브가 재생을 막아요 (오류 153).<br>사이트 주소로 열어주세요.</div>`;
  } else {
    const params = new URLSearchParams({ autoplay: "1", rel: "0", playsinline: "1" });
    if (clip.start) params.set("start", clip.start);
    $("screen").innerHTML =
      `<iframe src="https://www.youtube-nocookie.com/embed/${clip.id}?${params}"
        title="${esc(clip.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  }
  const link = clip.file
    ? `<a href="${esc(clip.file)}" target="_blank" rel="noopener">원본 파일 열기 ↗</a>`
    : `<a href="https://www.youtube.com/watch?v=${clip.id}" target="_blank" rel="noopener">유튜브에서 열기 ↗</a>`;
  $("now").innerHTML = `
    <span class="label">Now playing</span>
    <h2>${esc(clip.title)}</h2>
    <div class="meta"><span class="tag">${esc(clip.game)}</span><span class="tag">${clip.file ? "MP4" : "YouTube"}</span>${clip.start ? `<span class="tag">${fmt(clip.start)}부터</span>` : ""}</div>
    ${link}`;
  render();
  $("screen").scrollIntoView({ behavior: "smooth", block: "start" });
}

function render() {
  $("count").textContent = clips.length;
  const games = ["전체", ...new Set(clips.map((c) => c.game))];
  if (!games.includes(filter)) filter = "전체";
  $("filters").innerHTML = games.map((g) =>
    `<button class="chip" aria-pressed="${g === filter}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  const list = clips.map((c, i) => ({ c, i })).filter(({ c }) => filter === "전체" || c.game === filter);
  $("grid").innerHTML = loadError ? `<p class="empty">${loadError}</p>` : list.length ? list.map(({ c, i }) => `
    <div class="clip ${c.key === currentId ? "playing" : ""}" role="button" tabindex="0" data-i="${i}">
      <div class="thumb">${c.file
        ? `<video src="${esc(c.file)}#t=1" muted preload="metadata" playsinline></video><span class="badge-mp4">MP4</span>`
        : `<img src="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" alt="" loading="lazy">`}</div>
      <span class="t">${esc(c.title)}</span>
      <span class="sub"><span class="tag">${esc(c.game)}</span>${c.start ? fmt(c.start) + "부터" : ""}</span>
    </div>`).join("") : `<p class="empty">아직 클립이 없어요. 위에서 링크를 붙여넣어 첫 클립을 추가해 보세요.</p>`;
}

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.g; render();
});
$("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".clip"); if (card) play(clips[+card.dataset.i]);
});
$("grid").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("clip")) {
    e.preventDefault(); play(clips[+e.target.dataset.i]);
  }
});

$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  $("fileName").textContent = f ? f.name : "또는 mp4 파일 선택";
  $("fileBtn").classList.toggle("has-file", !!f);
  if (f && !$("title").value) $("title").value = f.name.replace(/\.[^.]+$/, "").slice(0, 100);
});

function uploadFile(file) {
  const ext = (file.name.match(/\.(mp4|webm|mov)$/i) || [".mp4"])[0].toLowerCase();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}${ext}`;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
    for (const [k, v] of Object.entries(HEADERS)) if (k !== "Content-Type") xhr.setRequestHeader(k, v);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "false");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $("bar").style.width = `${(e.loaded / e.total) * 100}%`;
    };
    xhr.onload = () => xhr.status < 300
      ? resolve(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`)
      : reject(new Error(`업로드 실패 (${xhr.status})`));
    xhr.onerror = () => reject(new Error("네트워크 오류"));
    xhr.send(file);
  });
}

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg");
  const file = $("file").files[0];
  const urlText = $("url").value.trim();
  const fail = (t) => { msg.className = "form-msg err"; msg.textContent = t; };

  const row = {
    title: ($("title").value.trim() || "제목 없는 클립").slice(0, 100),
    game: ($("game").value.trim() || "기타").slice(0, 40),
    start_sec: 0,
  };
  if (file) {
    if (file.size > MAX_MB * 1024 * 1024)
      return fail(`파일이 ${(file.size / 1048576).toFixed(0)}MB라 너무 커요. ${MAX_MB}MB 이하로 잘라서 올려주세요.`);
  } else if (urlText) {
    const parsed = parseYouTube(urlText);
    if (!parsed) return fail("유튜브 영상 주소를 인식하지 못했어요. youtube.com/watch?v=… 형태의 링크를 붙여넣어 주세요.");
    row.video_id = parsed.id; row.start_sec = parsed.start;
  } else {
    return fail("유튜브 링크를 붙여넣거나 mp4 파일을 선택해 주세요.");
  }

  const btn = e.target.querySelector("button"); btn.disabled = true;
  msg.className = "form-msg";
  try {
    if (file) {
      $("progress").hidden = false; $("bar").style.width = "0";
      msg.textContent = "영상 올리는 중… 창을 닫지 마세요.";
      row.video_url = await uploadFile(file);
    } else {
      msg.textContent = "추가하는 중…";
    }
    const r = await fetch(API, { method: "POST", headers: HEADERS, body: JSON.stringify(row) });
    if (!r.ok) throw new Error(`저장 실패 (${r.status})`);
    msg.textContent = `"${row.title}" 추가됨. 이제 모두에게 보여요.`;
    e.target.reset();
    $("fileName").textContent = "또는 mp4 파일 선택"; $("fileBtn").classList.remove("has-file");
    await loadClips();
  } catch (err) {
    fail(`추가하지 못했어요: ${err.message}. 잠시 후 다시 시도해 주세요.`);
  } finally {
    btn.disabled = false; $("progress").hidden = true;
  }
});

function esc(s) { return String(s).replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

render();
loadClips();
setInterval(loadClips, 30000);
</script>
</body>
</html>
